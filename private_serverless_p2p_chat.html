<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuruRaayaraAashirvadha Private Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background-color: #1e293b; padding: 16px; text-align: center; border-bottom: 1px solid #334155; }
    header h1 { font-size: 1.2rem; color: #38bdf8; }
    .status { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; }
    #chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .sent { background-color: #0284c7; color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }
    .received { background-color: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
    .setup-box { background-color: #1e293b; margin: 16px; padding: 16px; border-radius: 8px; border: 1px solid #334155; }
    textarea { width: 100%; height: 80px; background: #0f172a; color: #f8fafc; border: 1px solid #475569; padding: 8px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 10px; resize: none; }
    button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    button:active { background: #0369a1; }
    .input-area { padding: 12px; background: #1e293b; display: flex; gap: 8px; border-top: 1px solid #334155; }
    .input-area input { flex: 1; padding: 12px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 6px; outline: none; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <h1>GuruRaayaraAashirvadha</h1>
    <div id="status" class="status">Status: Offline (Direct P2P)</div>
  </header>

  <div id="setup-panel" class="setup-box">
    <h3>Connect Devices</h3>
    <p style="font-size:0.8rem; color:#94a3b8; margin: 8px 0 12px 0;">1. Click "Create Invite" on Phone A and copy code.<br>2. Paste code into Phone B and click "Accept Invite".<br>3. Copy Phone B's answer code back to Phone A.</p>
    <button onclick="createOffer()">1. Create Invite Code (Phone A)</button>
    <button onclick="acceptOffer()">2. Accept Invite Code (Phone B)</button>
    <textarea id="sdp-data" placeholder="Paste connection code here..."></textarea>
    <button onclick="completeConnection()" style="background:#16a34a;">3. Complete Connection (Phone A)</button>
  </div>

  <div id="chat-container"></div>

  <div id="input-panel" class="input-area hidden">
    <input type="text" id="msg-input" placeholder="Type a private message..." onkeypress="if(event.key==='Enter') sendMessage()" />
    <button onclick="sendMessage()" style="width: auto; margin:0; padding: 0 16px;">Send</button>
  </div>

  <script>
    let pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
    let dc;

    pc.onicecandidate = e => {
      if (!e.candidate) {
        document.getElementById('sdp-data').value = JSON.stringify(pc.localDescription);
      }
    };

    pc.ondatachannel = e => {
      dc = e.channel;
      setupDataChannel();
    };

    async function createOffer() {
      dc = pc.createDataChannel("chat");
      setupDataChannel();
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
    }

    async function acceptOffer() {
      const offer = JSON.parse(document.getElementById('sdp-data').value);
      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
    }

    async function completeConnection() {
      const answer = JSON.parse(document.getElementById('sdp-data').value);
      await pc.setRemoteDescription(answer);
    }

    function setupDataChannel() {
      dc.onopen = () => {
        document.getElementById('status').innerText = "Status: Connected (Direct P2P)";
        document.getElementById('status').style.color = "#4ade80";
        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('input-panel').classList.remove('hidden');
        loadHistory();
      };
      dc.onmessage = e => renderMessage(e.data, 'received');
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !dc) return;
      dc.send(text);
      renderMessage(text, 'sent');
      input.value = '';
    }

    function renderMessage(text, type) {
      const container = document.getElementById('chat-container');
      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerText = text;
      container.appendChild(msg);
      container.scrollTop = container.scrollHeight;

      // Save locally to localStorage
      const history = JSON.parse(localStorage.getItem('p2p_chat') || '[]');
      history.push({ text, type, time: new Date() });
      localStorage.setItem('p2p_chat', JSON.stringify(history));
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('p2p_chat') || '[]');
      history.forEach(m => renderMessage(m.text, m.type));
    }
  </script>
</body>
</html>
